name = "pesawatch-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"                    # your code reads this as env.DB
database_name = "pesawatch"       # must match the name used in `wrangler d1 create`
database_id = "PASTE-YOUR-D1-ID"  # run `npx wrangler d1 list` and copy the ID
migrations_dir = "../migrations"  # migrations live one folder above /api
